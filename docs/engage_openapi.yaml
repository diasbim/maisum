openapi: 3.0.3
info:
  title: MaisUm Engage and Referral API
  version: 1.0.0
  description: |
    OpenAPI specification for Engage endpoints plus the implemented merchant
    affiliate/referral/reward/metrics endpoints in Cloud Functions. Internal
    admin affiliate routes exist as well, but this file stays oriented to the
    merchant/customer operational surfaces.
servers:
  - url: https://<region>-<project>.cloudfunctions.net/api
security:
  - bearerAuth: []
paths:
  /engage/dashboard:
    get:
      summary: Get Engage dashboard metrics
      tags: [Engage]
      responses:
        '200':
          description: Dashboard loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /engage/recovery-queue:
    get:
      summary: Get prioritized recovery queue
      tags: [Engage]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Queue loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryQueueResponse'
  /engage/task:
    post:
      summary: Create recovery task
      tags: [Engage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: Task created, or the existing open task returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreationResponse'
  /engage/task/complete:
    post:
      summary: Complete recovery task
      tags: [Engage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: string
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMutationResponse'
  /engage/action:
    post:
      summary: Register recovery action
      tags: [Engage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'
      responses:
        '200':
          description: Action registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionMutationResponse'
  /engage/visit-report:
    post:
      summary: Submit visit report
      tags: [Engage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitReportRequest'
      responses:
        '200':
          description: Visit report saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitMutationResponse'
  /engage/surveys:
    get:
      summary: List active surveys with questions
      tags: [Engage, Surveys]
      responses:
        '200':
          description: Surveys loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveysResponse'
    post:
      summary: Create survey with up to 5 questions
      tags: [Engage, Surveys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '200':
          description: Survey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSurveyResponse'
        '400':
          description: Validation failed
  /engage/survey-response:
    post:
      summary: Submit survey response
      tags: [Engage, Surveys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSurveyResponseRequest'
      responses:
        '200':
          description: Response saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitSurveyResponseApiResponse'
  /engage/analytics:
    get:
      summary: Get survey analytics metrics
      tags: [Engage, Surveys]
      responses:
        '200':
          description: Analytics loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
  /merchant/affiliates:
    get:
      summary: List merchant affiliates
      description: Read-only for any authenticated member of the business.
      tags: [Affiliates, Merchant]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Affiliates loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliatePageResponse'
    post:
      summary: Create affiliate for merchant
      description: Owner-only. Creates or reuses the platform identity, links it, and mints the merchant code.
      tags: [Affiliates, Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateCreateRequest'
      responses:
        '200':
          description: Affiliate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliateResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
        '500':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliates/sync:
    post:
      summary: Reconcile an offline affiliate create
      description: Owner-only. Accepts either the direct payload or the queue wrapper with `payload`.
      tags: [Affiliates, Merchant, Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateSyncRequest'
      responses:
        '200':
          description: Offline affiliate create reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateSyncResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliates/metrics:
    get:
      summary: Get merchant affiliate metrics
      tags: [Affiliates, Merchant, Metrics]
      responses:
        '200':
          description: Metrics loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateMetricsResponse'
  /merchant/affiliates/{affiliateId}:
    get:
      summary: Get one merchant affiliate
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
      responses:
        '200':
          description: Affiliate loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliateResponse'
        '404':
          $ref: '#/components/responses/AffiliateError'
    patch:
      summary: Rename merchant affiliate
      description: Owner-only. Renames the affiliate display name for the merchant-facing record. Existing codes do not change.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateRenameRequest'
      responses:
        '200':
          description: Affiliate renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliateResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliates/{affiliateId}/metrics:
    get:
      summary: Get metrics for one merchant affiliate
      tags: [Affiliates, Merchant, Metrics]
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
      responses:
        '200':
          description: Metrics loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateMetricsResponse'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliates/{affiliateId}/activate:
    post:
      summary: Activate affiliate link for merchant
      description: Owner-only. Reactivates the affiliate link for this merchant.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
      responses:
        '200':
          description: Affiliate activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliateResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliates/{affiliateId}/deactivate:
    post:
      summary: Deactivate affiliate link for merchant
      description: Owner-only. The history stays; the code stops being accepted.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/AffiliateId'
      responses:
        '200':
          description: Affiliate deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAffiliateResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-codes:
    get:
      summary: List merchant affiliate codes
      tags: [Affiliates, Merchant]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - in: query
          name: affiliate_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Codes loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodePageResponse'
    post:
      summary: Create affiliate code for linked affiliate
      description: Owner-only. One code per affiliate-merchant pair in the current MVP.
      tags: [Affiliates, Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateCodeCreateRequest'
      responses:
        '200':
          description: Code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodeResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-codes/{codeId}:
    get:
      summary: Get one merchant affiliate code
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/CodeId'
      responses:
        '200':
          description: Code loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodeResponse'
        '404':
          $ref: '#/components/responses/AffiliateError'
    patch:
      summary: Update affiliate code
      description: Owner-only. Omitting a field leaves it unchanged.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/CodeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateCodePatchRequest'
      responses:
        '200':
          description: Code updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodeResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-codes/{codeId}/enable:
    post:
      summary: Enable affiliate code
      description: Owner-only.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/CodeId'
      responses:
        '200':
          description: Code enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodeResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-codes/{codeId}/disable:
    post:
      summary: Disable affiliate code
      description: Owner-only.
      tags: [Affiliates, Merchant]
      parameters:
        - $ref: '#/components/parameters/CodeId'
      responses:
        '200':
          description: Code disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCodeResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/referrals/validate-code:
    post:
      summary: Validate referral code preview
      description: Available to any authenticated business member. Advisory only; the sale commit revalidates everything.
      tags: [Affiliates, Merchant, Referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralValidateRequest'
      responses:
        '200':
          description: Validation answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralValidationApiResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '429':
          $ref: '#/components/responses/AffiliateRateLimited'
  /merchant/referral-sales/commit:
    post:
      summary: Commit an online referred sale
      description: Available to any authenticated business member. Firestore-backed authoritative decision.
      tags: [Affiliates, Merchant, Referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralSaleCommitRequest'
      responses:
        '200':
          description: Sale committed, replayed, or referral rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSaleCommitResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
  /merchant/referral-sales/sync:
    post:
      summary: Reconcile an offline referral sale
      description: Available to any authenticated business member. Accepts either the direct payload or the queue wrapper with `payload`.
      tags: [Affiliates, Merchant, Referrals, Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralSaleSyncRequest'
      responses:
        '200':
          description: Offline sale reconciled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSaleSyncResponse'
        '400':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
  /merchant/referrals:
    get:
      summary: List referral attributions
      tags: [Affiliates, Merchant, Referrals]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [CONFIRMED, REJECTED, CANCELLED]
        - in: query
          name: affiliate_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Referrals loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralAttributionPageResponse'
  /merchant/referrals/{attributionId}:
    get:
      summary: Get referral attribution detail
      tags: [Affiliates, Merchant, Referrals]
      parameters:
        - $ref: '#/components/parameters/AttributionId'
      responses:
        '200':
          description: Attribution loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralAttributionDetailResponse'
        '404':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-rewards:
    get:
      summary: List affiliate rewards
      tags: [Affiliates, Merchant, Rewards]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, PAID, CANCELLED]
        - in: query
          name: affiliate_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Rewards loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateRewardPageResponse'
  /merchant/affiliate-rewards/{rewardId}/approve:
    post:
      summary: Approve affiliate reward
      description: Owner-only. Approval is online-only and does not pay the reward automatically.
      tags: [Affiliates, Merchant, Rewards]
      parameters:
        - $ref: '#/components/parameters/RewardId'
      responses:
        '200':
          description: Reward approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateRewardResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
  /merchant/affiliate-rewards/{rewardId}/cancel:
    post:
      summary: Cancel affiliate reward
      description: Owner-only. A paid reward is refused for manual review rather than auto-reversed.
      tags: [Affiliates, Merchant, Rewards]
      parameters:
        - $ref: '#/components/parameters/RewardId'
      responses:
        '200':
          description: Reward cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateRewardResponse'
        '403':
          $ref: '#/components/responses/AffiliateError'
        '404':
          $ref: '#/components/responses/AffiliateError'
        '409':
          $ref: '#/components/responses/AffiliateError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AffiliateId:
      in: path
      name: affiliateId
      required: true
      schema:
        type: string
    CodeId:
      in: path
      name: codeId
      required: true
      schema:
        type: string
    AttributionId:
      in: path
      name: attributionId
      required: true
      schema:
        type: string
    RewardId:
      in: path
      name: rewardId
      required: true
      schema:
        type: string
  responses:
    AffiliateError:
      description: Stable affiliate/referral error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliateErrorResponse'
    AffiliateRateLimited:
      description: Validation budget exhausted for this caller and merchant
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds before the caller may retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliateRateLimitedResponse'
  schemas:
    ApiEnvelopeBase:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    DashboardData:
      type: object
      properties:
        customers_active:
          type: integer
        customers_at_risk:
          type: integer
        critical_customers:
          type: integer
        revenue_at_risk:
          type: number
        recovered_customers:
          type: integer
    DashboardResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DashboardData'
    RecoveryQueueItem:
      type: object
      properties:
        customer_id:
          type: string
        customer_name:
          type: string
        days_since_visit:
          type: integer
        risk_level:
          type: string
          enum: [green, yellow, orange, red]
        priority:
          type: integer
        total_spent:
          type: number
        total_points:
          type: integer
        last_visit_at:
          type: integer
          nullable: true
    RecoveryQueueResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RecoveryQueueItem'
    CreateTaskRequest:
      type: object
      required: [id, customer_id]
      properties:
        id:
          type: string
        customer_id:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        due_at:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
    RecoveryTask:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        customer_id:
          type: string
        priority:
          type: string
        status:
          type: string
        due_at:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: integer
        updated_at:
          type: integer
    TaskMutationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RecoveryTask'
    TaskCreationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              type: object
              required: [task, outcome]
              properties:
                task:
                  $ref: '#/components/schemas/RecoveryTask'
                outcome:
                  type: string
                  enum: [created, already_open]
    CreateActionRequest:
      type: object
      required: [customer_id, action_type]
      properties:
        id:
          type: string
          description: Client-generated stable ID used to make retries idempotent.
        customer_id:
          type: string
        task_id:
          type: string
          nullable: true
        action_type:
          type: string
        payload:
          type: object
          additionalProperties: true
    RecoveryAction:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        customer_id:
          type: string
        task_id:
          type: string
          nullable: true
        action_type:
          type: string
        payload:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: integer
        updated_at:
          type: integer
    ActionMutationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RecoveryAction'
    CreateVisitReportRequest:
      type: object
      required: [customer_id, result]
      properties:
        id:
          type: string
          description: Client-generated stable ID used to make retries idempotent.
        customer_id:
          type: string
        task_id:
          type: string
          nullable: true
        result:
          type: string
        notes:
          type: string
          nullable: true
        visited_at:
          type: integer
    VisitReport:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        task_id:
          type: string
          nullable: true
        customer_id:
          type: string
        result:
          type: string
        notes:
          type: string
          nullable: true
        visited_at:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
    VisitMutationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelopeBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/VisitReport'
    SurveyQuestionInput:
      type: object
